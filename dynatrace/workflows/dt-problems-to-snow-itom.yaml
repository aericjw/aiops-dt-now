id: 7c35a230-d8bf-4379-8137-43b8ad000f3d
title: Dynatrace Problems to ServiceNow ITOM (AIOps) v2
isDeployed: true
description: Forwards Davis problems to ServiceNow ITOM Event Management as em_event records. ServiceNow performs dedup, reopen and close natively using message_key, so a single task covers the entire problem lifecycle.
actor: 1910bc7a-1e77-420e-b669-3ffba145e214
owner: 1910bc7a-1e77-420e-b669-3ffba145e214
ownerType: USER
isPrivate: false
schemaVersion: 4
trigger:
  eventTrigger:
    filterQuery: event.kind == "DAVIS_PROBLEM" AND dt.analysis.ready == true AND (matchesValue(event.category, {"MONITORING_UNAVAILABLE", "AVAILABILITY", "ERROR", "SLOWDOWN", "RESOURCE_CONTENTION", "CUSTOM_ALERT", "INFO"})) AND (matchesValue(k8s.cluster.name, "aeric-walls-aks"))
    isActive: true
    triggerConfiguration:
      type: davis-problem
      value:
        analysisReady: true
        categories:
          availability: true
          custom: true
          error: true
          info: true
          monitoringUnavailable: true
          resource: true
          slowdown: true
        customFilter: matchesValue(k8s.cluster.name, "aeric-walls-aks")
        entityTags: {}
        entityTagsMatch: null
        onProblemClose: true
        problemOpenDuration: null
        severityThreshold: null
        triggerOn: open-and-close
        triggerOnUpdateFields:
          - dt.davis.impact_level
          - event.category
          - event.severity
          - root_cause_entity_id
    uniqueExpression: '{{ event()["event.id"] }}-{{ "open" if event()["event.status"] == "ACTIVE" else "resolved" }}-{{ event()["dt.davis.last_reopen_timestamp"] }}'
triggerType: Event
type: STANDARD
input:
  snow_source: Dynatrace
  snow_table: em_event
hourlyExecutionLimit: 1000
tasks:
  extract_events:
    action: dynatrace.automations:execute-dql-query
    description: Make use of Dynatrace Grail data in your workflow.
    input:
      failOnEmptyResult: false
      query: |-
        fetch events, from:"{{event()["timestamp"]}}"-5m, to:"{{event()["timestamp"]}}"+5m
        | filter event.kind == "DAVIS_EVENT"
        | filter in(event.id, {{event()["dt.davis.event_ids"] | replace("[", "{") | replace("]", "}") | replace("'", "\"")}})
        | dedup event.id, sort:{timestamp desc}
        | filterOut dt.davis.is_frequent_event == true
        | fieldsAdd dt_raw_type = arrayFirst(coalesce(smartscape.affected_entity.types, affected_entity_types))
        | fieldsAdd dt_entity_key = if(isNull(dt_raw_type), "__unknown__",
            else: lower(if(startsWith(dt_raw_type, "dt.entity."), substring(dt_raw_type, from: 10), else: dt_raw_type)))
        | fieldsAdd dt_entity_id = toString(dt.smartscape_source.id)
        | fieldsAdd dt_entity_name = coalesce(getNodeName(dt.smartscape_source.id), arrayFirst(affected_entity_names))
        | fieldsAdd dt_problem_display_id = "{{ event()['display_id'] }}"
        | fieldsAdd dt_problem_url = concat("https://bwm98081.apps.dynatrace.com/ui/apps/dynatrace.davis.problems/problem/", "{{ event()['event.id'] }}")
        | lookup [load "/lookups/dt_to_snow_cmdb_mapping_v2"],
            sourceField: dt_entity_key, lookupField: dt_entity_key,
            fields: {now_ci_class, bind_strategy, sgc_managed}
        | fields event.id, event.name, event.category, event.severity, event.status,
            event.description, dt_entity_key, dt_entity_id, dt_entity_name,
            now_ci_class, bind_strategy, sgc_managed,
            dt.davis.is_rootcause_relevant, dt_problem_display_id, dt_problem_url, timestamp
    name: extract_events
    position:
      x: 0
      "y": 1
    predecessors: []
  send_event_to_servicenow:
    action: dynatrace.servicenow:snow-create-record
    active: true
    concurrency: 1
    conditions:
      states:
        extract_events: SUCCESS
    description: 'Create one em_event in ServiceNow. Handles open, update and close: message_key is the stable Dynatrace problem event ID, so ServiceNow Event Management dedupes and reopens automatically, and severity 0 (Clear) on problem close resolves the alert.'
    input:
      connectionId: vu9U3hXa3q0AAAABACNhcHA6ZHluYXRyYWNlLnNlcnZpY2Vub3c6Y29ubmVjdGlvbgAGdGVuYW50AAZ0ZW5hbnQAJGY2YzBkZDM2LWUxNmYtM2MwNi04YTYzLTY2NjQ5MTBkMTNhNL7vVN4V2t6t
      fields:
        - id: f-message-key
          key: message_key
          value: '{{ _.item["event.id"] }}'
        - id: f-source
          key: source
          value: "{{ input('snow_source') }}"
        - id: f-severity
          key: severity
          value: '{{ 0 if _.item["event.status"] == "CLOSED" else _.item["event.severity"] }}'
        - id: f-event-class
          key: event_class
          value: '{{ _.item["event.category"] }}'
        - id: f-resource
          key: resource
          value: '{{ _.item["dt_entity_name"] }}'
        - id: f-node
          key: node
          value: '{{ _.item["dt_entity_name"] }}'
        - id: f-metric-name
          key: metric_name
          value: '{{ _.item["event.name"] }}'
        - id: f-type
          key: type
          value: '{{ _.item["dt_entity_key"] }}'
        - id: f-ci-type
          key: ci_type
          value: '{{ _.item["now_ci_class"] }}'
        - id: f-description
          key: description
          value: '[{{ _.item["dt_problem_display_id"] }}] {{ _.item["event.name"] }} - {{ _.item["event.description"] | default("", true) | truncate(900, true) }}'
        - id: f-additional-info
          key: additional_info
          value: '{{ _.item }}'
      tableName: "{{ input('snow_table') }}"
    name: send_event_to_servicenow
    position:
      x: 0
      "y": 2
    predecessors:
      - extract_events
    withItems: item in {{result("extract_events")["records"]}}
