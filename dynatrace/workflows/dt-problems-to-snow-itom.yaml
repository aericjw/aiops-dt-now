id: 7c35a230-d8bf-4379-8137-43b8ad000f3d
title: Dynatrace Problems to ServiceNow ITOM (AIOps) v2
isDeployed: true
description: Forwards Davis problems to ServiceNow ITOM Event Management as em_event records. ServiceNow performs dedup, reopen and close natively using message_key, so a single task covers the entire problem lifecycle.
actor: 1910bc7a-1e77-420e-b669-3ffba145e214
owner: 1910bc7a-1e77-420e-b669-3ffba145e214
ownerType: USER
isPrivate: false
schemaVersion: 4
trigger:
  eventTrigger:
    filterQuery: event.kind == "DAVIS_PROBLEM" AND dt.analysis.ready == true AND (matchesValue(event.category, {"MONITORING_UNAVAILABLE", "AVAILABILITY", "ERROR", "SLOWDOWN", "RESOURCE_CONTENTION", "CUSTOM_ALERT", "INFO"})) AND (matchesValue(k8s.cluster.name, "aeric-walls-aks"))
    isActive: true
    triggerConfiguration:
      type: davis-problem
      value:
        analysisReady: true
        categories:
          availability: true
          custom: true
          error: true
          info: true
          monitoringUnavailable: true
          resource: true
          slowdown: true
        customFilter: matchesValue(k8s.cluster.name, "aeric-walls-aks")
        entityTags: {}
        entityTagsMatch: null
        onProblemClose: true
        problemOpenDuration: null
        severityThreshold: null
        triggerOn: open-and-close
        triggerOnUpdateFields:
          - dt.davis.impact_level
          - event.category
          - event.severity
          - root_cause_entity_id
    uniqueExpression: '{{ event()["event.id"] }}-{{ "open" if event()["event.status"] == "ACTIVE" else "resolved" }}-{{ event()["dt.davis.last_reopen_timestamp"] }}'
triggerType: Event
type: STANDARD
input:
  snow_source: Dynatrace
  snow_table: em_event
hourlyExecutionLimit: 1000
tasks:
  extract_events:
    action: dynatrace.automations:execute-dql-query
    customSampleResult:
      records:
        - dt.analysis.offset: "300000000000"
          dt.davis.impact_level: Services
          dt.davis.is_frequent_event: false
          dt.davis.is_rootcause_relevant: true
          dt.davis.mute.status: NOT_MUTED
          dt.davis.timeout: "9"
          dt.entity.cloud_application:
            - CLOUD_APPLICATION-6DEA6CD9B2A01320
          dt.entity.cloud_application.name:
            - frontend
          dt.entity.cloud_application.type.name: Kubernetes workload
          dt.entity.cloud_application_namespace:
            - CLOUD_APPLICATION_NAMESPACE-977945A8F690CB33
          dt.entity.cloud_application_namespace.name:
            - astroshop
          dt.entity.cloud_application_namespace.type.name: Kubernetes namespace
          dt.entity.kubernetes_cluster:
            - KUBERNETES_CLUSTER-BBB0E13242F16433
          dt.entity.kubernetes_cluster.name:
            - aeric-walls-aks
          dt.entity.kubernetes_cluster.type.name: Kubernetes cluster
          dt.entity.service: SERVICE-9BE8E7CD3715AE37
          dt.entity.service.name: frontend - astroshop - aeric-walls-aks
          dt.entity.service.type.name: Service
          dt.event.correlation_id: 330a400f45acf983af49048ee1d108b1
          dt.openpipeline.pipelines:
            - davis.events:default
          dt.openpipeline.source: baselining
          dt.query: |-
            timeseries {
              failuresCount = sum(dt.service.request.failure_count),
              totalCount = sum(dt.service.request.count)
            }, by: { endpoint.name, dt.entity.service }, filter: {
              dt.entity.service == "SERVICE-9BE8E7CD3715AE37"
              AND endpoint.name == "POST /api/checkout"
            }, nonempty: true
            | fieldsAdd expression = failuresCount[] / totalCount[] * 100
            | fieldsRemove failuresCount, totalCount

            | fieldsAdd metricName = "Failure rate"
          dt.smartscape.k8s_cluster: K8S_CLUSTER-F1E6F62616280CAB
          dt.smartscape.k8s_deployment: K8S_DEPLOYMENT-751A28BDE87FD7E5
