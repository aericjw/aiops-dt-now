id: 7c35a230-d8bf-4379-8137-43b8ad000f3d
title: Dynatrace to ServiceNow ITOM (AIOps)
isDeployed: true
description: Forwards Davis problems to ServiceNow ITOM Event Management as em_event records. ServiceNow performs dedup, reopen and close natively using message_key, so a single task covers the entire problem lifecycle.
actor: 1910bc7a-1e77-420e-b669-3ffba145e214
owner: 1910bc7a-1e77-420e-b669-3ffba145e214
ownerType: USER
isPrivate: false
schemaVersion: 4
trigger:
  eventTrigger:
    filterQuery: event.kind == "DAVIS_PROBLEM" AND dt.analysis.ready == true AND (matchesValue(event.category, {"MONITORING_UNAVAILABLE", "AVAILABILITY", "ERROR", "SLOWDOWN", "RESOURCE_CONTENTION", "CUSTOM_ALERT", "INFO"})) AND (dt.davis.is_duplicate == false and matchesValue(primary_tags.team, "agentic-aeric"))
    isActive: true
    triggerConfiguration:
      type: davis-problem
      value:
        analysisReady: true
        categories:
          availability: true
          custom: true
          error: true
          info: true
          monitoringUnavailable: true
          resource: true
          slowdown: true
        # Live-instance-only scoping (added directly on the instance, not by
        # this repo's earlier apply): dt.davis.is_duplicate == false plus a
        # team filter narrows the trigger to this project's own test traffic
        # (primary_tags.team=agentic-aeric) rather than tenant-wide. This is a
        # literal value, not a workflow input: Dynatrace's trigger config
        # parser rejects {{ input() }} templates inside customFilter, so this
        # field cannot be parameterized -- edit the literal directly to
        # re-scope, e.g. matchesValue(k8s.cluster.name, "some-cluster").
        customFilter: dt.davis.is_duplicate == false and matchesValue(primary_tags.team, "agentic-aeric")
        entityTags: {}
        entityTagsMatch: null
        onProblemClose: true
        problemOpenDuration: null
        severityThreshold: null
        triggerOn: open-and-close
        triggerOnUpdateFields:
          - dt.davis.impact_level
          - event.category
          - event.severity
          - root_cause_entity_id
          - smartscape.affected_entities
    uniqueExpression: '{{ event()["event.id"] }}-{{ "open" if event()["event.status"] == "ACTIVE" else "resolved" }}-{{ event()["dt.davis.last_reopen_timestamp"] }}'
triggerType: Event
type: STANDARD
input:
  snow_source: Dynatrace
  snow_table: em_event
hourlyExecutionLimit: 1000
tasks:
  extract_events:
    action: dynatrace.automations:execute-dql-query
    description: Make use of Dynatrace Grail data in your workflow.
    input:
      failOnEmptyResult: false
      query: |-
        fetch events, from:toTimestamp("{{event()["timestamp"]}}")-15m, to:toTimestamp("{{event()["timestamp"]}}"+15m)
        | filter event.kind == "DAVIS_EVENT"
        | filter in(event.id, {{event()["dt.davis.event_ids"] | replace("[", "{") | replace("]", "}") | replace("'", "\"")}})
        | dedup event.id, sort:{timestamp desc}
        | filterOut dt.davis.is_frequent_event == true
        | fieldsAdd dt_raw_type = arrayFirst(coalesce(smartscape.affected_entity.types, affected_entity_types))
        | fieldsAdd dt_entity_key = if(isNull(dt_raw_type), "__unknown__",
            else: lower(if(startsWith(dt_raw_type, "dt.entity."), substring(dt_raw_type, from: 10), else: dt_raw_type)))
        | fieldsAdd dt_entity_id = toString(dt.smartscape_source.id)
        // Fix (2026-09-15, P-26092999 investigation): the authoritative Davis
        // root-cause signal is the PROBLEM's own root_cause_entity_id (only
        // ever populated on the DAVIS_PROBLEM trigger event, exposed here via
        // event()), NOT the per-event dt.davis.is_rootcause_relevant flag --
        // that flag was observed true on BOTH events of a 2-entity problem
        // simultaneously (broker-service and frontendreverseproxy both true),
        // letting whichever alert arrived later in ServiceNow win PRIMARY
        // regardless of which one Davis actually named as root cause.
        // Comparing dt_entity_id against the problem-level root_cause_entity_id
        // is exclusive by construction (at most one entity can equal it).
        // FIX (2026-09-15, P-26093008 execution failure): root_cause_entity_id
        // is not always present on the trigger event -- a single-entity
        // problem, or a pre-root-cause-determination update, has no such
        // field at all, and an unguarded {{ event()['root_cause_entity_id'] }}
        // throws "Undefined variables" and fails the ENTIRE extract_events
        // task (no events at all, including a close, reach ServiceNow for
        // that execution). Defaulted to an empty string, which dt_entity_id
        // (never empty) can never equal, so dt_is_root_cause safely evaluates
        // to false rather than crashing the task.
        | fieldsAdd dt_is_root_cause = dt_entity_id == "{{ event()['root_cause_entity_id'] | default('', true) }}"
        | fieldsAdd dt_entity_name = coalesce(getNodeName(dt.smartscape_source.id), arrayFirst(affected_entity_names), dt.entity.application.name)
        | fieldsAdd dt_problem_display_id = "{{ event()['display_id'] }}"
        | fieldsAdd dt_problem_url = concat("{{environment()["url"] }}", "/ui/apps/dynatrace.davis.problems/problem/", "{{ event()['event.id'] }}")
        | lookup [load "/lookups/dt_to_snow_cmdb_mapping_v6"],
            sourceField: dt_entity_key, lookupField: dt_entity_key,
            fields: {now_ci_class, bind_strategy, sgc_managed}
        | lookup [ smartscapeEdges "runs_on", from:-24h
            | fieldsAdd s = toString(source_id), t = toString(target_id)
            | filter startsWith(s, "PROCESS-") and startsWith(t, "HOST-")
            | fieldsAdd host_name = getNodeName(target_id)
            | fields s, host_name ],
            sourceField: dt_entity_id, lookupField: s, fields: {host_name}
        | fieldsAdd dt_ci_name = if(bind_strategy == "sgc_service" and isNotNull(dt_entity_name), concat(dt_entity_name, " - ", dt_entity_id),
            else: if(bind_strategy == "sgc_process" and isNotNull(dt_entity_name) and isNotNull(host_name), concat(dt_entity_name, "@", host_name),
            else: dt_entity_name))
        //| fieldsKeep event.id, event.name, event.category, event.severity, event.status,
        //    event.description, dt_entity_key, dt_entity_id, dt_entity_name, dt_ci_name,
        //    now_ci_class, bind_strategy, sgc_managed,
        //    dt.davis.is_rootcause_relevant, dt_problem_display_id, dt_problem_url, timestamp, entity_tags, "primary_tags.*"
    name: extract_events
    position:
      x: 0
      "y": 1
    predecessors: []
  send_event_to_servicenow:
    action: dynatrace.servicenow:snow-create-record
    active: true
    concurrency: 1
    conditions:
      states:
        extract_events: SUCCESS
    description: 'Create one em_event in ServiceNow. Handles open, update and close: message_key is the stable Dynatrace problem event ID, so ServiceNow Event Management dedupes and reopens automatically, and severity 0 (Clear) on problem close resolves the alert.'
    input:
      connectionId: vu9U3hXa3q0AAAABACNhcHA6ZHluYXRyYWNlLnNlcnZpY2Vub3c6Y29ubmVjdGlvbgAGdGVuYW50AAZ0ZW5hbnQAJGY2YzBkZDM2LWUxNmYtM2MwNi04YTYzLTY2NjQ5MTBkMTNhNL7vVN4V2t6t
      fields:
        - id: f-message-key
          key: message_key
          value: '{{ _.item["event.id"] }}'
        - id: f-source
          key: source
          value: '{{ input(''snow_source'') }}'
        - id: f-severity
          key: severity
          # FIX (2026-09-15, P-26092999 investigation): was `_.item["event.status"]`,
          # each extracted event's own per-entity status, re-derived by a fresh
          # DQL fetch every execution. Found a live case where the problem's
          # close trigger fired within ~70ms of the underlying entity's own
          # DAVIS_EVENT flipping to CLOSED in Grail -- too tight for that write
          # to be reliably visible to the same-moment query, so the extract
          # picked up a stale ACTIVE snapshot and severity=2 went out instead
          # of 0, silently dropping the close for that one entity (it later
          # got auto-closed by ServiceNow's own idle-alert threshold job, then
          # reopened when this stale event arrived, never truly resolving).
          # event()["event.status"] is the PROBLEM-level trigger's own status,
          # already reliably CLOSED for a close-triggered execution with no
          # re-query needed -- since this execution IS the close, every
          # extracted event in the batch should resolve together regardless
          # of any single entity's own indexing lag.
          value: '{{ 0 if event()["event.status"] == "CLOSED" else _.item["event.severity"] }}'
        - id: f-event-class
          key: event_class
          value: '{{ _.item["event.category"] }}'
        - id: f-resource
          key: resource
          value: '{{ _.item["dt_entity_name"] }}'
        - id: f-ci-name
          key: node
          value: '{{ _.item["dt_ci_name"] }}'
        - id: f-metric-name
          key: metric_name
          value: '{{ _.item["event.name"] }}'
        - id: f-type
          key: type
          value: '{{ _.item["dt_entity_key"] }}'
        - id: f-ci-type
          key: ci_type
          value: '{{ _.item["now_ci_class"] }}'
        - id: f-description
          key: description
          value: '[{{ _.item["dt_problem_display_id"] }}] {{ _.item["event.name"] }} - {{ _.item["event.description"] | default("", true) | truncate(900, true) }}'
        - id: f-additional-info
          key: additional_info
          value: '{{ _.item }}'
      tableName: '{{ input(''snow_table'') }}'
    name: send_event_to_servicenow
    position:
      x: 0
      "y": 2
    predecessors:
      - extract_events
    withItems: item in {{result("extract_events")["records"]}}
