            - primary_tags.environment:azure
            - primary_tags.team:agentic-aeric
            - serviceTag:frontend - astroshop - aeric-walls-aks
          event.name: Failure rate increase
          k8s.cluster.name:
            - aeric-walls-aks
          k8s.namespace.name:
            - astroshop
          k8s.workload.name:
            - frontend
